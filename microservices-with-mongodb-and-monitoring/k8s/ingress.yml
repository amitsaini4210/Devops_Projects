apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatapp-ingress
  namespace: chat-app
  labels:
    name: chatapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: chat-app.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: chat-app
            port: 
              number: 8080
      
