apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: chat-app
spec:
  schedule: "*/2 * * * *"

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure

          containers:
            - name: mongodb-backup
              image: mongo:4.4

              env:
                - name: MONGO_HOST
                  value: "mongodb"

                - name: MONGO_PORT
                  value: "27017"

                - name: MONGO_INITDB_ROOT_USERNAME
                  value: mongoadmin

                - name: MONGO_INITDB_ROOT_PASSWORD
                  value : secret

              command:
                - /bin/bash
                - -c
                - |
                  set -e

                  DATE=$(date +"%Y-%m-%d_%H-%M-%S")
                  BACKUP_DIR="/backups/${DATE}"

                  mkdir -p "${BACKUP_DIR}"

                  echo "Starting MongoDB backup..."

                  mongodump \
                    --host="${MONGO_HOST}" \
                    --port="${MONGO_PORT}" \
                    --username="${MONGO_INITDB_ROOT_USERNAME}" \
                    --password="${MONGO_INITDB_ROOT_PASSWORD}" \
                    --authenticationDatabase=admin \
                    --out="${BACKUP_DIR}"

                  echo "MongoDB backup completed."

                  echo "Compressing backup..."

                  tar -czf \
                    "/backups-${DATE}.tar.gz" \
                    -C "/backups" \
                    "${DATE}"

                  rm -rf "${BACKUP_DIR}"

                  echo "Backup created:"
                  ls -lh /backups/

              volumeMounts:
                - name: backup-storage
                  mountPath: /backups

          volumes:
            - name: backup-storage
              hostPath:
                path: /backups
                type: DirectoryOrCreate
